<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3d2cb"/></marker></defs><rect width="1920" height="1080" fill="#f6f8f7"/><text x="120" y="120" font-size="52" fill="#0f3d2e" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">How SiteLog is built</text><text x="120" y="172" font-size="28" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">One deployed service, one hosted database</text><rect x="130" y="300" width="330" height="300" rx="14" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><text x="160" y="356" font-size="34" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">On a phone</text><text x="160" y="404" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">React, mobile first</text><text x="160" y="440" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Outbox in browser</text><text x="160" y="476" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">storage</text><rect x="160" y="510" width="270" height="54" rx="8" fill="#fff4e0" stroke="#fff4e0" stroke-width="0"/><text x="295" y="545" font-size="25" fill="#c97a10" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">works offline</text><rect x="640" y="270" width="480" height="360" rx="14" fill="#ffffff" stroke="#0f3d2e" stroke-width="3"/><text x="670" y="326" font-size="34" fill="#0f3d2e" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Render</text><text x="670" y="366" font-size="23" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">one web service, Frankfurt</text><rect x="670" y="400" width="420" height="90" rx="10" fill="#f6f8f7" stroke="#c3d2cb" stroke-width="2"/><text x="692" y="442" font-size="28" fill="#15201c" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Express API</text><text x="692" y="472" font-size="22" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">auth, reports, dashboard, exports</text><rect x="670" y="505" width="420" height="90" rx="10" fill="#f6f8f7" stroke="#c3d2cb" stroke-width="2"/><text x="692" y="547" font-size="28" fill="#15201c" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Built React app</text><text x="692" y="577" font-size="22" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">served from the same origin</text><rect x="1300" y="300" width="400" height="300" rx="14" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><text x="1330" y="356" font-size="34" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Neon</text><text x="1330" y="396" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">managed PostgreSQL</text><text x="1330" y="432" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Frankfurt</text><rect x="1330" y="466" width="340" height="54" rx="8" fill="#e7f5ed" stroke="#e7f5ed" stroke-width="0"/><text x="1500" y="501" font-size="25" fill="#0f3d2e" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">10 tables</text><text x="1330" y="560" font-size="22" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">TLS on every connection</text><line x1="470" y1="450" x2="630" y2="450" stroke="#c3d2cb" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="428" font-size="22" fill="#5c6b65" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">HTTPS</text><line x1="1130" y1="450" x2="1290" y2="450" stroke="#c3d2cb" stroke-width="3" marker-end="url(#arrow)"/><text x="1210" y="428" font-size="22" fill="#5c6b65" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">SQL</text><rect x="130" y="700" width="1570" height="130" rx="14" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><text x="165" y="752" font-size="32" fill="#15201c" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Chosen for who maintains it in December, not for what is newest.</text><text x="165" y="796" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">No ORM, no CSS framework, no charting library — a small dependency list the IT team can read.</text></svg>