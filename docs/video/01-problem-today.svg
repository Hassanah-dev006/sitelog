<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3d2cb"/></marker></defs><rect width="1920" height="1080" fill="#f6f8f7"/><text x="120" y="120" font-size="52" fill="#0f3d2e" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">How site reporting works today</text><text x="120" y="172" font-size="28" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Tihama Limited — before SiteLog</text><rect x="150.0" y="330" width="360" height="230" rx="14" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><text x="180.0" y="388" font-size="34" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Supervisor</text><text x="180.0" y="434" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">writes the day's</text><text x="180.0" y="466" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">report on paper</text><rect x="180.0" y="498" width="300" height="40" rx="8" fill="#fdecea" stroke="#fdecea" stroke-width="0"/><text x="330.0" y="525" font-size="23" fill="#a3241c" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">6pm, on site</text><line x1="522.0" y1="445.0" x2="558.0" y2="445.0" stroke="#c3d2cb" stroke-width="3" marker-end="url(#arrow)"/><rect x="570.0" y="330" width="360" height="230" rx="14" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><text x="600.0" y="388" font-size="34" f