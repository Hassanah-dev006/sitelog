<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3d2cb"/></marker></defs><rect width="1920" height="1080" fill="#f6f8f7"/><text x="120" y="110" font-size="52" fill="#0f3d2e" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">What happens when there is no signal</text><text x="120" y="162" font-size="28" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">The sequence that makes SiteLog usable on a real site</text><rect x="150" y="260" width="1620" height="118" rx="12" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><circle cx="212" cy="319" r="32" fill="#0f3d2e"/><text x="212" y="332" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">1</text><text x="276" y="308" font-size="32" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Supervisor presses Send</text><text x="276" y="348" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">The report is written to the phone first, before any network call.</text><rect x="150" y="396" width="1620" height="118" rx="12" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><circle cx="212" cy="455" r="32" fill="#c97a10"/><text x="212" y="468" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">2</text><text x="276" y="444" font-size="32" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">No connection</text><text x="276" y="484" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">The app says so plainly: saved on this phone, it will send by itself.</text><rect x="150" y="532" width="1620" height="118" rx="12" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><circle cx="212" cy="591" r="32" fill="#c97a10"/><text x="212" y="604" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">3</text><text x="276" y="580" font-size="32" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">The phone keeps trying</text><text x="276" y="620" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Each attempt reuses the same identifier, generated once when Send was pressed.</text><rect x="150" y="668" width="1620" height="118" rx="12" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><circle cx="212" cy="727" r="32" fill="#0f3d2e"/><text x="212" y="740" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">4</text><text x="276" y="716" font-size="32" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Signal returns</text><text x="276" y="756" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">The queue sends itself. Nobody has to remember to do anything.</text><rect x="150" y="804" width="1620" height="118" rx="12" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><circle cx="212" cy="863" r="32" fill="#0f3d2e"/><text x="212" y="876" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">5</text><text x="276" y="852" font-size="32" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Stored exactly once</text><text x="276" y="892" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">The database refuses a repeat of that identifier. Three sends, one record.</text><rect x="150" y="950" width="1620" height="110" rx="14" fill="#e7f5ed" stroke="#0f3d2e" stroke-width="3"/><text x="960.0" y="1002" font-size="32" fill="#0f3d2e" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">A report sent three times from a failing connection</text><text x="960.0" y="1042" font-size="32" fill="#0f3d2e" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">is stored once.</text></svg>