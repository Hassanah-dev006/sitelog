<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3d2cb"/></marker></defs><rect width="1920" height="1080" fill="#f6f8f7"/><text x="120" y="120" font-size="52" fill="#0f3d2e" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">What the tests missed</text><text x="120" y="172" font-size="28" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Three faults found by deploying it and using it</text><rect x="150" y="300" width="1620" height="160" rx="12" fill="#ffffff" stroke="#a3241c" stroke-width="3"/><text x="190" y="356" font-size="34" fill="#a3241c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">The export that would not download</text><text x="190" y="402.0" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">A plain link is a browser navigation, so no JavaScript runs and the login token is never</text><text x="190" y="438.25" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">attached. The server was right to refuse.</text><rect x="150" y="486" width="1620" height="160" rx="12" fill="#ffffff" stroke="#a3241c" stroke-width="3"/><text x="190" y="542" font-size="34" fill="#a3241c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">The site number nobody could know</text><text x="190" y="588.0" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Supervisors cannot list projects, so the form quietly fell back to asking them to type a site</text><text x="190" y="624.25" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">id they had no way of finding.</text><rect x="150" y="672" width="1620" height="160" rx="12" fill="#ffffff" stroke="#a3241c" stroke-width="3"/><text x="190" y="728" font-size="34" fill="#a3241c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">The script that wrote NaN and said it worked</text><text x="190" y="774.0" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">The same flag meant a site id in one script and a site name in another. It did not crash — it</text><text x="190" y="810.25" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">stored nonsense and reported success.</text><rect x="150" y="868" width="1620" height="120" rx="14" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><text x="960.0" y="918" font-size="34" fill="#15201c" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">All three passed 228 automated tests.</text><text x="960.0" y="960" font-size="28" fill="#5c6b65" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">None survived contact with a real user.</text></svg>