<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3d2cb"/></marker></defs><rect width="1920" height="1080" fill="#f6f8f7"/><text x="120" y="120" font-size="52" fill="#0f3d2e" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">How it works with SiteLog</text><text x="120" y="172" font-size="28" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Same supervisor, same six o'clock</text><rect x="150.0" y="330" width="360" height="230" rx="14" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><text x="180.0" y="388" font-size="34" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Supervisor</text><text x="180.0" y="434" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">fills in the report</text><text x="180.0" y="466" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">on a phone</text><rect x="180.0" y="498" width="300" height="40" rx="8" fill="#e7f5ed" stroke="#e7f5ed" stroke-width="0"/><text x="330.0" y="525" font-size="23" fill="#0f3d2e" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">2 minutes</text><line x1="522.0" y1="445.0" x2="558.0" y2="445.0" stroke="#c3d2cb" stroke-width="3" marker-end="url(#arrow)"/><rect x="570.0" y="330" width="360" height="230" rx="14" fill="#ffffff" stroke="#c97a10" stroke-width="3"/><text x="600.0" y="388" font-size="34" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Saved on phone</text><text x="600.0" y="434" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">kept safely even</text><text x="600.0" y="466" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">with no signal</text><rect x="600.0" y="498" width="300" height="40" rx="8" fill="#fff4e0" stroke="#fff4e0" stroke-width="0"/><text x="750.0" y="525" font-size="23" fill="#c97a10" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">instant</text><line x1="942.0" y1="445.0" x2="978.0" y2="445.0" stroke="#c3d2cb" stroke-width="3" marker-end="url(#arrow)"/><rect x="990.0" y="330" width="360" height="230" rx="14" fill="#ffffff" stroke="#c97a10" stroke-width="3"/><text x="1020.0" y="388" font-size="34" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Sent by itself</text><text x="1020.0" y="434" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">when the connection</text><text x="1020.0" y="466" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">returns</text><rect x="1020.0" y="498" width="300" height="40" rx="8" fill="#fff4e0" stroke="#fff4e0" stroke-width="0"/><text x="1170.0" y="525" font-size="23" fill="#c97a10" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">automatic</text><line x1="1362.0" y1="445.0" x2="1398.0" y2="445.0" stroke="#c3d2cb" stroke-width="3" marker-end="url(#arrow)"/><rect x="1410.0" y="330" width="360" height="230" rx="14" fill="#ffffff" stroke="#c3d2cb" stroke-width="2"/><text x="1440.0" y="388" font-size="34" fill="#15201c" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Head office</text><text x="1440.0" y="434" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">sees it on the</text><text x="1440.0" y="466" font-size="25" fill="#5c6b65" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">dashboard</text><rect x="1440.0" y="498" width="300" height="40" rx="8" fill="#e7f5ed" stroke="#e7f5ed" stroke-width="0"/><text x="1590.0" y="525" font-size="23" fill="#0f3d2e" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">same evening</text><text x="960.0" y="630" font-size="26" fill="#5c6b65" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">The two highlighted steps are the ones that make it work where the network does not.</text><rect x="150.0" y="680" width="1620" height="150" rx="14" fill="#e7f5ed" stroke="#0f3d2e" stroke-width="3"/><text x="960.0" y="742" font-size="42" fill="#0f3d2e" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">Head office knows the same evening</text><text x="960.0" y="792" font-size="28" fill="#0f3d2e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" opacity="1">and the dashboard names any site that has not reported today.</text></svg>